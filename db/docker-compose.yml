version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_club_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportsclub
      POSTGRES_PASSWORD: sportsclub
      POSTGRES_DB: sportsclub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
